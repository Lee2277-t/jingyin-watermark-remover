name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心回归（Windows）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 启动服务并等待探活
        shell: pwsh
        run: |
          Start-Process -FilePath python -ArgumentList "server.py" -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod "http://127.0.0.1:8765/api/health" -TimeoutSec 3
              if ($h.ok) { Write-Host "健康检查通过：$($h | ConvertTo-Json -Compress)"; $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "服务没有起来，最近日志："
            if (Test-Path work/tool.log) { Get-Content work/tool.log -Tail 30 }
            exit 1
          }

      - name: 跑核心回归
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python work/qa/_run_all.py

      - name: 失败时上传回归日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: |
            ${{ env.TEMP }}/jingyin_qa_*
            work/tool.log
          if-no-files-found: ignore
          retention-days: 7
